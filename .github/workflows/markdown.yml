name: Validate Markdown

on:
  push:
    paths: ["**.md"]
  pull_request:
    paths: ["**.md"]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: DavidAnson/markdownlint-cli2-action@v16
        with:
          globs: "**/*.md"
